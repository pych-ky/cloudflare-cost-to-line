name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_SEND_METRICS: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Generate configuration
        run: npm run configure
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
          DAILY_CRON: ${{ vars.DAILY_CRON }}
          MONTHLY_FIXED_COST_USD: ${{ vars.MONTHLY_FIXED_COST_USD }}
      - run: npm run build -- --config wrangler.generated.json
      - name: Deploy code and runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BILLING_API_TOKEN: ${{ secrets.BILLING_API_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_RECIPIENT_ID: ${{ secrets.LINE_RECIPIENT_ID }}
        run: |
          umask 077
          runtime_secrets_file="$(mktemp --suffix=.json "$RUNNER_TEMP/cloudflare-line-secrets.XXXXXX")"
          trap 'rm -f "$runtime_secrets_file"' EXIT
          export RUNTIME_SECRETS_FILE="$runtime_secrets_file"
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          const names = [
            "BILLING_API_TOKEN",
            "LINE_CHANNEL_ACCESS_TOKEN",
            "LINE_RECIPIENT_ID",
          ];
          const secrets = Object.fromEntries(names.map((name) => {
            const value = process.env[name];
            if (!value?.trim()) throw new Error(`Missing GitHub secret: ${name}`);
            return [name, value];
          }));
          if (!process.env.CLOUDFLARE_API_TOKEN?.trim()) {
            throw new Error("Missing GitHub secret: CLOUDFLARE_API_TOKEN");
          }
          await writeFile(process.env.RUNTIME_SECRETS_FILE, JSON.stringify(secrets), { mode: 0o600 });
          NODE
          ./node_modules/.bin/wrangler deploy --config wrangler.generated.json --secrets-file "$runtime_secrets_file"
