# 手動通知

name: Send cost notification now

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-manual-notification
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - run: npm run notify:now
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BILLING_API_TOKEN: ${{ secrets.BILLING_API_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_RECIPIENT_ID: ${{ secrets.LINE_RECIPIENT_ID }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
          MONTHLY_FIXED_COST_USD: ${{ vars.MONTHLY_FIXED_COST_USD }}
