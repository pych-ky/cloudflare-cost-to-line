# 検証と main の本番反映

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: API通信の診断ログを有効にする
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_SEND_METRICS: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          cache: npm
      - run: npm ci --engine-strict --strict-allow-scripts
      - run: npm run check
      - run: for script in scripts/*.mjs; do node --check "$script"; done
      - run: npm run configure
        env:
          CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
      - run: npm run build -- --config wrangler.generated.json

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-deploy
      queue: max
      cancel-in-progress: false
    env:
      CLOUDFLARE_SEND_METRICS: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          cache: npm
      - run: npm ci --engine-strict --strict-allow-scripts
      - run: npm run configure
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
          DAILY_CRON: ${{ vars.DAILY_CRON }}
          MONTHLY_FIXED_COST_USD: ${{ vars.MONTHLY_FIXED_COST_USD }}
      - run: npm run build -- --config wrangler.generated.json
      - name: Record current deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/capture-deployment.mjs wrangler.generated.json "$RUNNER_TEMP/deployment-before.json"
      - name: Save rollback record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-before.json
          if-no-files-found: error
      - name: Check latest main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "main が更新されたため、この実行のデプロイは見送りました。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy code and runtime secrets
        id: deploy
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        env:
          WRANGLER_LOG: ${{ inputs.debug && 'debug' || 'log' }}
          WRANGLER_LOG_SANITIZE: "true"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy-${{ github.run_id }}-${{ github.run_attempt }}.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BILLING_API_TOKEN: ${{ secrets.BILLING_API_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_RECIPIENT_ID: ${{ secrets.LINE_RECIPIENT_ID }}
        run: |
          umask 077
          RUNTIME_SECRETS_FILE="$(mktemp --suffix=.json "$RUNNER_TEMP/cloudflare-line-secrets.XXXXXX")"
          trap 'rm -f "$RUNTIME_SECRETS_FILE"' EXIT
          export RUNTIME_SECRETS_FILE
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          const secrets = {};
          for (const name of [
            "BILLING_API_TOKEN",
            "LINE_CHANNEL_ACCESS_TOKEN",
            "LINE_RECIPIENT_ID",
          ]) {
            const value = process.env[name];
            if (!value?.trim()) throw new Error(`GitHub Secret ${name} が設定されていません。`);
            secrets[name] = value;
          }
          if (!process.env.CLOUDFLARE_API_TOKEN?.trim()) {
            throw new Error("GitHub Secret CLOUDFLARE_API_TOKEN が設定されていません。");
          }
          if (!/^[UCR][a-f0-9]{32}$/i.test(secrets.LINE_RECIPIENT_ID)) {
            throw new Error("LINE_RECIPIENT_ID は U・C・R のいずれかと32桁の16進数で指定してください。");
          }
          await writeFile(process.env.RUNTIME_SECRETS_FILE, JSON.stringify(secrets), { mode: 0o600 });
          NODE
          ./node_modules/.bin/wrangler deploy --config wrangler.generated.json --secrets-file "$RUNTIME_SECRETS_FILE" --message "$GITHUB_SHA"
      - name: Verify production deployment
        id: verify
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-deployment.mjs wrangler.generated.json "$RUNNER_TEMP/wrangler-deploy-${{ github.run_id }}-${{ github.run_attempt }}.ndjson" "$RUNNER_TEMP/deployment-after.json"
      - name: Save deployment verification
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-after-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-after.json
          if-no-files-found: error
      - name: Report verification failure
        if: failure() && steps.verify.outcome == 'failure'
        run: echo "本番へのアップロード後の確認に失敗しました。本番は更新済みの可能性があります。自動復旧は行っていません。" >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnose dashboard API permissions
        if: failure() && inputs.debug && steps.deploy.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/diagnose-deploy.mjs
