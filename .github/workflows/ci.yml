# 検証と main の本番反映

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: API通信の診断ログを有効にする
        type: boolean
        default: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - run: npm ci --engine-strict --strict-allow-scripts
      - run: npm run check
      - run: for script in scripts/*.mjs; do node --check "$script"; done
      - run: npm run configure
        env:
          CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
      - run: npm run build -- --config wrangler.generated.json

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-deploy
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - run: npm ci --engine-strict --strict-allow-scripts
      - run: npm run configure
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
          DAILY_CRON: ${{ vars.DAILY_CRON }}
          MONTHLY_FIXED_COST_USD: ${{ vars.MONTHLY_FIXED_COST_USD }}
      - name: Check latest main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "main が更新されたため、この実行のデプロイは見送りました。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy code and runtime secrets
        if: steps.current.outputs.deploy == 'true'
        env:
          WRANGLER_LOG: ${{ inputs.debug && 'debug' || 'log' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BILLING_API_TOKEN: ${{ secrets.BILLING_API_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_RECIPIENT_ID: ${{ secrets.LINE_RECIPIENT_ID }}
        run: |
          RUNTIME_SECRETS_FILE="$(mktemp --suffix=.json "$RUNNER_TEMP/cloudflare-line-secrets.XXXXXX")"
          trap 'rm -f "$RUNTIME_SECRETS_FILE"' EXIT
          export RUNTIME_SECRETS_FILE
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          const secrets = {};
          for (const name of [
            "BILLING_API_TOKEN",
            "LINE_CHANNEL_ACCESS_TOKEN",
            "LINE_RECIPIENT_ID",
          ]) {
            const value = process.env[name];
            if (!value?.trim()) throw new Error(`GitHub Secret ${name} が設定されていません。`);
            secrets[name] = value;
          }
          if (!/^[UCR][a-f0-9]{32}$/i.test(secrets.LINE_RECIPIENT_ID)) {
            throw new Error("LINE_RECIPIENT_ID は U・C・R のいずれかと32桁の16進数で指定してください。");
          }
          await writeFile(process.env.RUNTIME_SECRETS_FILE, JSON.stringify(secrets));
          NODE
          ./node_modules/.bin/wrangler deploy --config wrangler.generated.json --secrets-file "$RUNTIME_SECRETS_FILE" --message "$GITHUB_SHA"
